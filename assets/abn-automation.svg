<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 600"
  width="800"
  height="600"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">ABN Automation</title>
  <desc id="desc">
    ABN Digital industrial automation and workflow orchestration visual
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07110f"/>
      <stop offset="100%" stop-color="#0b1916"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20c997"/>
      <stop offset="100%" stop-color="#159b74"/>
    </linearGradient>

    <radialGradient id="coreGlow">
      <stop offset="0%" stop-color="#20c997" stop-opacity=".35"/>
      <stop offset="65%" stop-color="#20c997" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#20c997" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#20c997"
        stroke-opacity=".07"
      />
    </pattern>

    <style>
      .line {
        fill: none;
        stroke: #20c997;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .thin {
        fill: none;
        stroke: #20c997;
        stroke-opacity: .3;
        stroke-width: 1;
      }

      .node {
        fill: #10211d;
        stroke: #20c997;
        stroke-opacity: .45;
      }

      .label {
        font-family:
          Inter,
          Arial,
          Helvetica,
          sans-serif;
        fill: #aebbb7;
        font-size: 12px;
        letter-spacing: 1.8px;
      }

      .title {
        font-family:
          Inter,
          Arial,
          Helvetica,
          sans-serif;
        fill: #f5f7f6;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      .pulse {
        animation: pulse 2.2s ease-in-out infinite;
        transform-origin: center;
      }

      .flow {
        stroke-dasharray: 9 11;
        animation: flow 1.8s linear infinite;
      }

      .float {
        animation: float 4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: .45;
          transform: scale(.9);
        }

        50% {
          opacity: 1;
          transform: scale(1.12);
        }
      }

      @keyframes flow {
        to {
          stroke-dashoffset: -40;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-7px);
        }
      }
    </style>
  </defs>

  <!-- =================================================
       BACKGROUND
       ================================================= -->

  <rect
    width="800"
    height="600"
    rx="28"
    fill="url(#bg)"
  />

  <rect
    x="1"
    y="1"
    width="798"
    height="598"
    rx="27"
    fill="url(#grid)"
    stroke="#20c997"
    stroke-opacity=".14"
  />

  <!-- Central ambient glow -->

  <circle
    cx="400"
    cy="315"
    r="230"
    fill="url(#coreGlow)"
    filter="url(#blur)"
  />

  <!-- =================================================
       HEADER
       ================================================= -->

  <text
    x="55"
    y="65"
    class="label"
  >
    ABN DIGITAL
  </text>

  <text
    x="55"
    y="102"
    class="title"
  >
    AUTOMATION
  </text>

  <path
    d="M55 125H745"
    class="thin"
  />

  <circle
    cx="735"
    cy="125"
    r="4"
    fill="#20c997"
    class="pulse"
  />

  <!-- =================================================
       INPUT MODULE
       ================================================= -->

  <g class="float">

    <rect
      x="70"
      y="220"
      width="170"
      height="105"
      rx="14"
      class="node"
    />

    <text
      x="92"
      y="250"
      class="label"
    >
      INPUT
    </text>

    <!-- Sensor -->

    <circle
      cx="110"
      cy="282"
      r="13"
      fill="#20c997"
      fill-opacity=".12"
      stroke="#20c997"
      stroke-opacity=".6"
    />

    <circle
      cx="110"
      cy="282"
      r="5"
      fill="#20c997"
      class="pulse"
    />

    <path
      d="M135 270H215"
      class="thin"
    />

    <path
      d="M135 285H195"
      class="thin"
    />

    <path
      d="M135 300H210"
      class="thin"
    />

  </g>

  <!-- =================================================
       OUTPUT MODULE
       ================================================= -->

  <g class="float">

    <rect
      x="560"
      y="220"
      width="170"
      height="105"
      rx="14"
      class="node"
    />

    <text
      x="582"
      y="250"
      class="label"
    >
      OUTPUT
    </text>

    <!-- Status -->

    <circle
      cx="600"
      cy="282"
      r="13"
      fill="#20c997"
      fill-opacity=".12"
      stroke="#20c997"
      stroke-opacity=".6"
    />

    <circle
      cx="600"
      cy="282"
      r="5"
      fill="#20c997"
      class="pulse"
    />

    <path
      d="M625 270H705"
      class="thin"
    />

    <path
      d="M625 285H690"
      class="thin"
    />

    <path
      d="M625 300H700"
      class="thin"
    />

  </g>

  <!-- =================================================
       AUTOMATION CORE
       ================================================= -->

  <g>

    <circle
      cx="400"
      cy="315"
      r="105"
      fill="#07110f"
      stroke="#20c997"
      stroke-opacity=".18"
    />

    <circle
      cx="400"
      cy="315"
      r="82"
      fill="#10211d"
      stroke="#20c997"
      stroke-opacity=".5"
    />

    <circle
      cx="400"
      cy="315"
      r="58"
      fill="url(#accent)"
      fill-opacity=".10"
      stroke="#20c997"
      stroke-width="2"
    />

    <!-- Gear-like automation symbol -->

    <path
      d="
        M400 270
        L410 284
        L428 282
        L431 300
        L446 310
        L435 325
        L440 343
        L422 348
        L412 363
        L396 354
        L380 363
        L370 348
        L352 343
        L357 325
        L346 310
        L361 300
        L364 282
        L382 284
        Z
      "
      fill="none"
      stroke="#20c997"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <circle
      cx="400"
      cy="315"
      r="22"
      fill="#20c997"
      fill-opacity=".14"
      stroke="#20c997"
      stroke-width="2"
    />

    <circle
      cx="400"
      cy="315"
      r="7"
      fill="#20c997"
      class="pulse"
    />

  </g>

  <!-- =================================================
       AUTOMATION CONNECTIONS
       ================================================= -->

  <path
    d="M240 272 C285 272 305 295 345 305"
    class="line flow"
  />

  <path
    d="M455 305 C495 295 520 272 560 272"
    class="line flow"
  />

  <!-- Secondary connection -->

  <path
    d="M240 300 C290 330 315 350 345 335"
    class="thin"
  />

  <path
    d="M455 335 C490 350 520 330 560 300"
    class="thin"
  />

  <!-- =================================================
       PROCESS PIPELINE
       ================================================= -->

  <g>

    <rect
      x="120"
      y="395"
      width="560"
      height="92"
      rx="15"
      fill="#0b1916"
      stroke="#20c997"
      stroke-opacity=".2"
    />

    <!-- Step 01 -->

    <circle
      cx="185"
      cy="440"
      r="22"
      fill="#10211d"
      stroke="#20c997"
      stroke-opacity=".5"
    />

    <text
      x="185"
      y="445"
      text-anchor="middle"
      class="label"
    >
      01
    </text>

    <text
      x="220"
      y="435"
      class="label"
    >
      TRIGGER
    </text>

    <path
      d="M220 452H275"
      class="thin"
    />

    <!-- Step 02 -->

    <circle
      cx="340"
      cy="440"
      r="22"
      fill="#10211d"
      stroke="#20c997"
      stroke-opacity=".5"
    />

    <text
      x="340"
      y="445"
      text-anchor="middle"
      class="label"
    >
      02
    </text>

    <text
      x="375"
      y="435"
      class="label"
    >
      PROCESS
    </text>

    <path
      d="M375 452H430"
      class="thin"
    />

    <!-- Step 03 -->

    <circle
      cx="495"
      cy="440"
      r="22"
      fill="#10211d"
      stroke="#20c997"
      stroke-opacity=".5"
    />

    <text
      x="495"
      y="445"
      text-anchor="middle"
      class="label"
    >
      03
    </text>

    <text
      x="530"
      y="435"
      class="label"
    >
      EXECUTE
    </text>

    <path
      d="M530 452H625"
      class="line flow"
    />

  </g>

  <!-- =================================================
       STATUS
       ================================================= -->

  <circle
    cx="58"
    cy="555"
    r="5"
    fill="#20c997"
    class="pulse"
  />

  <text
    x="75"
    y="559"
    class="label"
  >
    AUTOMATION ONLINE
  </text>

  <text
    x="745"
    y="559"
    text-anchor="end"
    class="label"
  >
    ABN / AUTO / 01
  </text>
</svg>