<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 600"
  width="800"
  height="600"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">ABN Animated SVG</title>
  <desc id="desc">
    ABN Digital animated SVG industrial automation visual
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07110f"/>
      <stop offset="100%" stop-color="#0b1916"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20c997"/>
      <stop offset="100%" stop-color="#159b74"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#20c997" stop-opacity=".35"/>
      <stop offset="70%" stop-color="#20c997" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#20c997" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#20c997"
        stroke-opacity=".08"
      />
    </pattern>

    <style>
      .line {
        fill: none;
        stroke: #20c997;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .thin {
        fill: none;
        stroke: #20c997;
        stroke-opacity: .3;
        stroke-width: 1;
      }

      .label {
        font-family:
          Inter,
          Arial,
          Helvetica,
          sans-serif;
        fill: #aebbb7;
        font-size: 12px;
        letter-spacing: 2px;
      }

      .title {
        font-family:
          Inter,
          Arial,
          Helvetica,
          sans-serif;
        fill: #f5f7f6;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
        transform-origin: center;
      }

      .float {
        animation: float 4s ease-in-out infinite;
      }

      .dash {
        stroke-dasharray: 10 12;
        animation: flow 2s linear infinite;
      }

      .spin {
        animation: spin 14s linear infinite;
        transform-origin: 400px 300px;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: .45;
          transform: scale(.92);
        }

        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes flow {
        to {
          stroke-dashoffset: -44;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </defs>

  <!-- Background -->

  <rect
    width="800"
    height="600"
    rx="28"
    fill="url(#bg)"
  />

  <rect
    x="1"
    y="1"
    width="798"
    height="598"
    rx="27"
    fill="url(#grid)"
    stroke="#20c997"
    stroke-opacity=".14"
  />

  <!-- Ambient glow -->

  <circle
    cx="400"
    cy="300"
    r="240"
    fill="url(#glow)"
    filter="url(#blur)"
  />

  <!-- Header -->

  <text
    x="55"
    y="65"
    class="label"
  >
    ABN DIGITAL
  </text>

  <text
    x="55"
    y="102"
    class="title"
  >
    ANIMATED SVG
  </text>

  <!-- Decorative top line -->

  <path
    d="M55 125H745"
    class="thin"
  />

  <circle
    cx="735"
    cy="125"
    r="4"
    fill="#20c997"
    class="pulse"
  />

  <!-- Outer technical rings -->

  <g class="spin">
    <circle
      cx="400"
      cy="310"
      r="160"
      class="thin"
    />

    <circle
      cx="400"
      cy="310"
      r="190"
      class="thin"
      stroke-dasharray="3 12"
    />

    <circle
      cx="400"
      cy="310"
      r="220"
      class="thin"
      stroke-dasharray="2 18"
    />
  </g>

  <!-- Connection network -->

  <path
    d="M185 235 L300 285 L400 210 L510 285 L625 235"
    class="line dash"
  />

  <path
    d="M190 400 L300 335 L400 410 L510 335 L615 400"
    class="line dash"
  />

  <path
    d="M300 285 L300 335"
    class="thin"
  />

  <path
    d="M510 285 L510 335"
    class="thin"
  />

  <path
    d="M400 210 L400 410"
    class="thin"
  />

  <!-- Left industrial module -->

  <g class="float">
    <rect
      x="135"
      y="195"
      width="105"
      height="80"
      rx="12"
      fill="#10211d"
      stroke="#20c997"
      stroke-opacity=".45"
    />

    <rect
      x="153"
      y="215"
      width="32"
      height="22"
      rx="4"
      fill="#20c997"
      fill-opacity=".12"
      stroke="#20c997"
      stroke-opacity=".45"
    />

    <path
      d="M200 220H222M200 230H216"
      class="thin"
    />

    <circle
      cx="160"
      cy="253"
      r="5"
      fill="#20c997"
      class="pulse"
    />

    <path
      d="M175 253H220"
      class="thin"
    />
  </g>

  <!-- Right industrial module -->

  <g class="float">
    <rect
      x="560"
      y="195"
      width="105"
      height="80"
      rx="12"
      fill="#10211d"
      stroke="#20c997"
      stroke-opacity=".45"
    />

    <path
      d="M580 220H645"
      class="thin"
    />

    <path
      d="M580 235H630"
      class="thin"
    />

    <path
      d="M580 250H640"
      class="thin"
    />

    <circle
      cx="642"
      cy="250"
      r="5"
      fill="#20c997"
      class="pulse"
    />
  </g>

  <!-- Central digital core -->

  <g>
    <circle
      cx="400"
      cy="310"
      r="92"
      fill="#07110f"
      stroke="#20c997"
      stroke-opacity=".2"
    />

    <circle
      cx="400"
      cy="310"
      r="72"
      fill="#10211d"
      stroke="#20c997"
      stroke-opacity=".5"
    />

    <circle
      cx="400"
      cy="310"
      r="52"
      fill="url(#accent)"
      fill-opacity=".12"
      stroke="#20c997"
      stroke-width="2"
    />

    <circle
      cx="400"
      cy="310"
      r="18"
      fill="#20c997"
      fill-opacity=".2"
      class="pulse"
    />

    <circle
      cx="400"
      cy="310"
      r="8"
      fill="#20c997"
    />
  </g>

  <!-- Central data connections -->

  <g class="pulse">
    <circle cx="400" cy="225" r="4" fill="#20c997"/>
    <circle cx="400" cy="395" r="4" fill="#20c997"/>
    <circle cx="315" cy="310" r="4" fill="#20c997"/>
    <circle cx="485" cy="310" r="4" fill="#20c997"/>
  </g>

  <!-- Bottom automation modules -->

  <g class="float">
    <rect
      x="145"
      y="445"
      width="130"
      height="58"
      rx="10"
      fill="#10211d"
      stroke="#20c997"
      stroke-opacity=".3"
    />

    <text
      x="165"
      y="470"
      class="label"
    >
      AUTOMATION
    </text>

    <path
      d="M165 484H245"
      class="line"
    />
  </g>

  <g class="float">
    <rect
      x="335"
      y="445"
      width="130"
      height="58"
      rx="10"
      fill="#10211d"
      stroke="#20c997"
      stroke-opacity=".3"
    />

    <text
      x="365"
      y="470"
      class="label"
    >
      SVG ENGINE
    </text>

    <path
      d="M355 484H445"
      class="line"
    />
  </g>

  <g class="float">
    <rect
      x="525"
      y="445"
      width="130"
      height="58"
      rx="10"
      fill="#10211d"
      stroke="#20c997"
      stroke-opacity=".3"
    />

    <text
      x="555"
      y="470"
      class="label"
    >
      DIGITAL ASSET
    </text>

    <path
      d="M545 484H635"
      class="line"
    />
  </g>

  <!-- Bottom status -->

  <circle
    cx="58"
    cy="555"
    r="5"
    fill="#20c997"
    class="pulse"
  />

  <text
    x="75"
    y="559"
    class="label"
  >
    SYSTEM READY
  </text>

  <text
    x="745"
    y="559"
    text-anchor="end"
    class="label"
  >
    ABN / SVG / 01
  </text>
</svg>