<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="tealGlow" x1="260" y1="180" x2="930" y2="650"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#20C997"/>
      <stop offset="1" stop-color="#159B74"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="0" cy="0" r="1"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(720 390) rotate(90) scale(270)">
      <stop stop-color="#20C997" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#20C997" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20C997" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#20C997" stop-opacity="0.025"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            stroke="#20C997"
            stroke-opacity="0.08"
            stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background technical grid -->
  <rect width="1200" height="800" fill="url(#grid)" opacity="0.65"/>

  <!-- Ambient glow -->
  <circle cx="720" cy="390" r="270" fill="url(#coreGlow)"/>
  <circle cx="720" cy="390" r="110"
          fill="#20C997"
          fill-opacity="0.07"
          filter="url(#blur)"/>

  <!-- Large industrial frame -->
  <rect x="405" y="155"
        width="500"
        height="470"
        rx="28"
        fill="url(#glass)"
        stroke="#20C997"
        stroke-opacity="0.18"/>

  <!-- Technical frame lines -->
  <path d="M435 210H875"
        stroke="#20C997"
        stroke-opacity="0.18"/>

  <path d="M435 570H875"
        stroke="#20C997"
        stroke-opacity="0.18"/>

  <!-- Corner brackets -->
  <path d="M435 250V210H475"
        stroke="#20C997"
        stroke-width="3"/>

  <path d="M835 210H875V250"
        stroke="#20C997"
        stroke-width="3"/>

  <path d="M435 530V570H475"
        stroke="#20C997"
        stroke-width="3"/>

  <path d="M835 570H875V530"
        stroke="#20C997"
        stroke-width="3"/>

  <!-- Central digital core -->
  <circle cx="655" cy="390" r="92"
          stroke="#20C997"
          stroke-opacity="0.15"
          stroke-width="2"/>

  <circle cx="655" cy="390" r="66"
          stroke="#20C997"
          stroke-opacity="0.32"
          stroke-width="2"/>

  <circle cx="655" cy="390" r="34"
          fill="#20C997"
          fill-opacity="0.12"
          stroke="#20C997"
          stroke-width="2"/>

  <circle cx="655" cy="390" r="12"
          fill="#20C997"/>

  <circle cx="655" cy="390" r="25"
          stroke="#20C997"
          stroke-opacity="0.35"
          stroke-width="8"
          filter="url(#softGlow)"/>

  <!-- Automation paths -->
  <path d="M655 324V260H540V220"
        stroke="url(#tealGlow)"
        stroke-width="3"/>

  <path d="M721 390H820V300H875"
        stroke="url(#tealGlow)"
        stroke-width="3"/>

  <path d="M655 456V520H560V570"
        stroke="url(#tealGlow)"
        stroke-width="3"/>

  <path d="M589 390H500V470H435"
        stroke="url(#tealGlow)"
        stroke-width="3"/>

  <!-- Connection nodes -->
  <circle cx="540" cy="220" r="7"
          fill="#20C997"/>

  <circle cx="875" cy="300" r="7"
          fill="#20C997"/>

  <circle cx="560" cy="570" r="7"
          fill="#20C997"/>

  <circle cx="435" cy="470" r="7"
          fill="#20C997"/>

  <!-- Industrial module: upper left -->
  <g transform="translate(455 265)">
    <rect width="125" height="82" rx="12"
          fill="#0B1916"
          stroke="#20C997"
          stroke-opacity="0.22"/>

    <path d="M20 55L43 32L60 46L88 18L106 34"
          stroke="#20C997"
          stroke-width="3"/>

    <circle cx="20" cy="55" r="4" fill="#20C997"/>
    <circle cx="43" cy="32" r="4" fill="#20C997"/>
    <circle cx="60" cy="46" r="4" fill="#20C997"/>
    <circle cx="88" cy="18" r="4" fill="#20C997"/>
    <circle cx="106" cy="34" r="4" fill="#20C997"/>
  </g>

  <!-- Industrial module: upper right -->
  <g transform="translate(750 235)">
    <rect width="100" height="130" rx="12"
          fill="#0B1916"
          stroke="#20C997"
          stroke-opacity="0.22"/>

    <rect x="18" y="20" width="64" height="12" rx="6"
          fill="#20C997"
          fill-opacity="0.25"/>

    <rect x="18" y="50" width="45" height="8" rx="4"
          fill="#20C997"
          fill-opacity="0.55"/>

    <rect x="18" y="70" width="58" height="8" rx="4"
          fill="#20C997"
          fill-opacity="0.30"/>

    <rect x="18" y="90" width="35" height="8" rx="4"
          fill="#20C997"
          fill-opacity="0.18"/>
  </g>

  <!-- Industrial module: bottom left -->
  <g transform="translate(470 500)">
    <rect width="145" height="62" rx="12"
          fill="#0B1916"
          stroke="#20C997"
          stroke-opacity="0.22"/>

    <circle cx="25" cy="31" r="11"
            stroke="#20C997"
            stroke-width="2"/>

    <path d="M25 20V42M14 31H36"
          stroke="#20C997"
          stroke-width="2"/>

    <rect x="52" y="21" width="68" height="7" rx="3.5"
          fill="#20C997"
          fill-opacity="0.35"/>

    <rect x="52" y="35" width="48" height="7" rx="3.5"
          fill="#20C997"
          fill-opacity="0.18"/>
  </g>

  <!-- Bottom right data blocks -->
  <g transform="translate(750 450)">
    <rect width="105" height="115" rx="12"
          fill="#0B1916"
          stroke="#20C997"
          stroke-opacity="0.22"/>

    <rect x="18" y="72" width="10" height="24" rx="3"
          fill="#20C997"
          fill-opacity="0.25"/>

    <rect x="35" y="55" width="10" height="41" rx="3"
          fill="#20C997"
          fill-opacity="0.40"/>

    <rect x="52" y="38" width="10" height="58" rx="3"
          fill="#20C997"
          fill-opacity="0.55"/>

    <rect x="69" y="22" width="10" height="74" rx="3"
          fill="#20C997"
          fill-opacity="0.75"/>
  </g>

  <!-- Floating SVG geometry -->
  <g opacity="0.8">
    <path d="M235 245L275 205L315 245L275 285L235 245Z"
          stroke="#20C997"
          stroke-opacity="0.45"
          stroke-width="2"/>

    <circle cx="275" cy="245" r="8"
            fill="#20C997"
            fill-opacity="0.55"/>
  </g>

  <g opacity="0.7">
    <path d="M955 470L985 440L1015 470L985 500L955 470Z"
          stroke="#20C997"
          stroke-opacity="0.35"
          stroke-width="2"/>

    <circle cx="985" cy="470" r="5"
            fill="#20C997"
            fill-opacity="0.45"/>
  </g>

  <!-- Data particles -->
  <g fill="#20C997">
    <circle cx="335" cy="330" r="3" opacity="0.5"/>
    <circle cx="375" cy="540" r="2" opacity="0.35"/>
    <circle cx="930" cy="205" r="3" opacity="0.45"/>
    <circle cx="1020" cy="350" r="2" opacity="0.35"/>
    <circle cx="940" cy="620" r="3" opacity="0.4"/>
    <circle cx="330" cy="610" r="2" opacity="0.3"/>
  </g>

  <!-- Decorative connection lines -->
  <path d="M315 245H370L405 280"
        stroke="#20C997"
        stroke-opacity="0.18"
        stroke-width="1.5"
        stroke-dasharray="5 8"/>

  <path d="M905 470H950"
        stroke="#20C997"
        stroke-opacity="0.18"
        stroke-width="1.5"
        stroke-dasharray="5 8"/>

  <!-- Tiny technical marks -->
  <g stroke="#20C997" stroke-opacity="0.3">
    <path d="M370 180H400"/>
    <path d="M370 190H390"/>
    <path d="M930 600H960"/>
    <path d="M930 610H950"/>
  </g>

</svg>